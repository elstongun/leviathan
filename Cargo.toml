[workspace]
members = [".", "bench/synth"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/elstongun/leviathan"
authors = ["Joshua Bak <joshuapbak@gmail.com>"]

[package]
name = "leviathan"
version = "0.1.0"
description = "Deep memory for agents over large datasets: index JSONL, CSV, SQLite or any database export once, answer with a few ranked, cited records in about five hundred tokens. CLI + MCP server."
readme = "README.md"
keywords = ["mcp", "agents", "search", "full-text", "sqlite"]
categories = ["command-line-utilities", "text-processing", "database"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
exclude = ["bench/data/", "docs/assets/*.psd"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
flate2 = "1.1.10"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
strsim = "0.11.1"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
